name: Check release version

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patch increment and changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release.mjs "$BASE_SHA"
